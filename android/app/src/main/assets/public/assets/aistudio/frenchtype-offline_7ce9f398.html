<html lang="fr">
<head>
<meta charset="utf-8">

<title>frenchtype — tape et apprends le français</title>
<style>
:root{--bg:#323437;--main:#e2b714;--sub:#646669;--tx:#d1d0c5;--err:#ca4754;--card:#2c2e31;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#e1e1e3;--main:#2b2b2c;--sub:#889;--tx:#2b2b2c;--err:#d33;--card:#d4d4d7}
:root[data-theme="ocean"]{--bg:#0f2438;--main:#4fd1c5;--sub:#4a6a86;--tx:#cfe6f5;--err:#ff6b81;--card:#132d46}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Roboto Mono",ui-monospace,Menlo,Consolas,monospace;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:20px 16px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.logo{font-size:26px;color:var(--main);font-weight:700}.logo small{color:var(--sub);font-size:12px;display:block;font-weight:400}
.top{color:var(--sub);font-size:13px}.top b{color:var(--tx)}
.bar{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;background:var(--card);border-radius:10px;padding:8px 14px;margin:6px auto;width:fit-content;max-width:100%;font-size:13px}
.bar span.g{display:flex;gap:10px;align-items:center}.bar .sep{width:4px;border-radius:2px;background:var(--bg)}
.o{cursor:pointer;color:var(--sub);user-select:none}.o:hover{color:var(--tx)}.o.on{color:var(--main)}
select{background:var(--bg);color:var(--tx);border:0;border-radius:6px;padding:2px 6px;font:inherit}
#live{height:34px;color:var(--main);font-size:24px;margin:26px 0 6px}
#wrap{position:relative;cursor:text}
#words{position:relative;font-size:26px;line-height:42px;height:126px;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;gap:0 14px;color:var(--sub);transition:opacity .15s}
#wrap.blur #words{opacity:.25}
#hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--tx);pointer-events:none}
#wrap.blur #hint{display:flex}
.w{position:relative;white-space:nowrap}.w.wrong{border-bottom:2px solid var(--err)}
.ok{color:var(--tx)}.bad{color:var(--err)}.extra{color:#7e2a33}
.bad.acc{color:var(--main);text-decoration:underline}
#caret{position:absolute;width:2px;height:30px;background:var(--main);border-radius:1px;transition:left .08s,top .08s;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#inp{position:absolute;opacity:0;left:0;top:0;width:1px;height:1px}
.hint2{text-align:center;color:var(--sub);font-size:13px;margin-top:30px}
kbd{background:var(--card);padding:1px 6px;border-radius:4px;color:var(--tx)}
#res{display:none}
.big{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.big div div:first-child{color:var(--sub);font-size:18px}.big .v{color:var(--main);font-size:56px;line-height:1.05}.big .s{font-size:34px;color:var(--main)}
.sm{display:flex;gap:26px;flex-wrap:wrap;color:var(--sub);margin:8px 0}.sm b{display:block;color:var(--main);font-size:22px}
svg.gr{width:100%;height:150px;background:var(--card);border-radius:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
button{font:inherit;background:var(--card);color:var(--tx);border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button:hover{background:var(--tx);color:var(--bg)}button.p{background:var(--main);color:var(--bg)}button:disabled{opacity:.5}
.chip{display:inline-block;background:var(--card);border-radius:6px;padding:2px 9px;margin:3px 6px 3px 0}
.chip i{color:var(--err);font-style:normal}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:10px}
.cd{background:var(--card);border-radius:10px;padding:12px}.cd h4{margin:0 0 4px;color:var(--main);font-size:18px}.cd p{margin:3px 0;font-size:14px}.cd .m{color:var(--sub)}
#dash{display:none}.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:12px;padding:16px;margin:10px 0}.hero .v{font-size:56px;color:var(--main);line-height:1}
.kp{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:10px 0}.kp>div{background:var(--card);border-radius:10px;padding:12px}.kp b{display:block;color:var(--main);font-size:24px}.kp span{color:var(--sub);font-size:12px}.kp i{font-style:normal;font-size:13px;margin-left:6px}
.pb{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:4px 0 10px}.pb i{display:block;height:100%;background:var(--main)}
.gl{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;width:100%}.gl input{width:70px;background:var(--bg);color:var(--tx);border:0;border-radius:6px;padding:4px 6px;font:inherit}
.up{color:#4caf50}.dn{color:var(--err)}
#tr{display:none;position:fixed;z-index:9;background:var(--card);color:var(--tx);border:1px solid var(--main);border-radius:10px;padding:10px 14px;max-width:240px;font-size:15px;box-shadow:0 6px 20px #0006}#tr b{color:var(--main);font-size:18px}#tr .m{color:var(--tx);margin-top:4px}
#words .w:hover{color:var(--tx);cursor:help}
#msg{text-align:center;color:var(--main);min-height:22px;margin:8px 0}
.lbl{color:var(--sub);font-size:13px;margin-top:14px}
</style>
</head>

  if(v.length>cur.length){const c=v[v.length-1],e=words[wi][v.length-1];ks++;if(e!==undefined&&(c===e||(!O.strict&&strip(c)===strip(e))))kok++;}
  cur=v;paint(wi);caret();
});
document.addEventListener("keydown",e=>{if(e.key==="Tab"||(e.key==="Escape")){e.preventDefault();reset();}});
$("wrap").onclick=()=>$("inp").focus();
$("inp").onfocus=()=>$("wrap").classList.remove("blur");
$("inp").onblur=()=>{if(!done)$("wrap").classList.add("blur");};
window.addEventListener("resize",caret);

function finish(){
  if(done)return;done=true;clearInterval(timer);
  const el_=O.mode==="time"?O.val:Math.max(1,(Date.now()-t0)/1000),m=el_/60;
  const wpm=okC/5/m,raw=rawC/5/m,acc=ks?kok/ks*100:0;
  const key=O.mode+O.val+O.src;if(!S.pb[key]||wpm>S.pb[key])S.pb[key]=wpm;
  S.hist.push({w:Math.round(wpm),a:Math.round(acc),d:Date.now(),e:accE,n:wi});S.hist=S.hist.slice(-200);
  Object.entries(wrongW).forEach(([w,c])=>{S.missed[w]=Math.min(9,(S.missed[w]||0)+c);});
  save();bars();show({wpm,raw,acc,el_,wrongN:Object.values(wrongW).reduce((a,b)=>a+b,0)});
}
function graph(){
  const NS="http://www.w3.org/2000/svg",s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 600 150");s.setAttribute("class","gr");s.setAttribute("preserveAspectRatio","none");
  if(samples.length<2)return s;
  const mx=Math.max(10,...samples.map(p=>Math.max(p.w,p.r)))*1.1;
  [["w","var(--main)"],["r","var(--sub)"]].forEach(([k,c])=>{
    const p=document.createElementNS(NS,"polyline");
    p.setAttribute("points",samples.map((q,i)=>(10+i/(samples.length-1)*580)+","+(140-q[k]/mx*125)).join(" "));
    p.setAttribute("fill","none");p.setAttribute("stroke",c);p.setAttribute("stroke-width","2.5");s.append(p);});
  return s;
}
function show(r){
  $("test").style.display="none";const R=$("res");R.textContent="";R.style.display="block";
  const big=el("div","big");
  [["mpm",Math.round(r.wpm),"v"],["précision",Math.round(r.acc)+"%","s"]].forEach(([l,v,c])=>{const d=el("div");d.append(el("div",null,l),el("div",c,v));big.append(d);});
  R.append(big,graph());
  const sm=el("div","sm");
  [["brut",Math.round(r.raw)],["temps",Math.round(r.el_)+"s"],["mots faux",r.wrongN],["fautes d’accent",accE]].forEach(([l,v])=>{const d=el("div");d.append(el("b",null,v),document.createTextNode(l));sm.append(d);});
  R.append(sm);
  const ws=Object.entries(wrongW).sort((a,b)=>b[1]-a[1]);
  const box=el("div");R.append(box);
  if(ws.length){R.append(el("div","lbl","mots à retravailler"));const ch=el("div");ws.forEach(([w,c])=>{const s=el("span","chip",w);s.style.cursor="pointer";s.onclick=e=>showTr(w,e);if(c>1)s.append(el("i",null," ×"+c));ch.append(s);});R.append(ch);}
  else R.append(el("div","lbl","aucun mot faux 🎉"));
  const bt=el("div","btns");
  const b1=el("button","p","↻ recommencer");b1.onclick=reset;bt.append(b1);
  if(ws.length){const b2=el("button",null,"retaper mes erreurs");b2.onclick=()=>{O.src="erreurs";O.mode="words";O.val=25;bars();reset();};bt.append(b2);
    {const b3=el("button",null,sample?"✨ expliquer mes erreurs (IA)":"expliquer mes erreurs");b3.onclick=()=>(sample?explain:explainLocal)(ws.slice(0,8).map(x=>x[0]),b3,R);bt.append(b3);}}
  R.append(bt);
}
async function explain(list,btn,R){
  if(busy)return;busy=true;btn.disabled=true;btn.textContent="analyse…";
  try{
    const r=await sample.json(`Tu es prof de français pour un Tunisien (niveau ${O.lvl}). Voici des mots français que l’élève a mal tapés ou mal écrits: ${list.join(", ")}.\nPour chaque mot réponds en JSON: [{"mot":"…","sens":"traduction en arabe tunisien (darija) en lettres latines + en arabe","phrase":"une phrase simple d’exemple en français","astuce":"astuce courte en darija latin pour retenir l’orthographe ou l’accent (genre, accent, double lettre…)"}]. Uniquement le JSON.`,{cache:false});
    const arr=Array.isArray(r)?r:(r.mots||[]);const c=el("div","cards");
    arr.forEach(x=>{const d=el("div","cd");d.append(el("h4",null,x.mot),el("p","m",x.sens||""),el("p",null,"« "+(x.phrase||"")+" »"),el("p",null,"💡 "+(x.astuce||"")));c.append(d);});
    R.append(el("div","lbl","explications"),c);btn.remove();
  }catch(e){btn.disabled=false;btn.textContent="✨ réessayer";}
  busy=false;
}
const clean=w=>w.toLowerCase().replace(/[.,;:!?«»"()]/g,"").trim();
const lookup=w=>{const k=clean(w);return D[k]||S.tr[k]||null;};
async function showTr(raw,e){
  const k=clean(raw),p=$("tr");p.style.display="block";
  const x=e?e.clientX:innerWidth/2,y=e?e.clientY:100;
  p.style.left=Math.max(8,Math.min(x,innerWidth-260))+"px";p.style.top=(y+16)+"px";
  let t=lookup(raw);
  p.textContent="";p.append(el("b",null,k));
  if(!t&&sample){p.append(el("div","m","traduction…"));
    try{const r=await sample.json(`Traduis le mot français « ${k} » en darija tunisien (lettres latines) puis en arabe, très court. Réponds en JSON: {"t":"…"}`,{cache:true});t=String(r.t||"");if(t){S.tr[k]=t;save();}}catch(_){}
    p.textContent="";p.append(el("b",null,k));}
  p.append(el("div","m",t||"pas dans le dictionnaire hors-ligne (ouvre la page dans claude.ai pour l’ajouter)"));
}
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#tr")&&!e.target.closest(".w")&&!e.target.closest(".chip"))$("tr").style.display="none";});
$("inp").addEventListener("input",()=>{$("tr").style.display="none";});
$("words").addEventListener("click",e=>{const d=e.target.closest(".w");if(!d)return;const i=[...$("words").children].indexOf(d)-1;if(words[i])showTr(words[i],e);});
function explainLocal(list,btn,R){
  const c=el("div","cards");
  list.forEach(w=>{const d=el("div","cd");d.append(el("h4",null,w));
    d.append(el("p","m",lookup(w)||"traduction non disponible hors-ligne"));
    const ac=[...new Set(w.match(/[àâäçéèêëîïôöùûüÿœæ]/gi)||[])];
    d.append(el("p",null,"💡 "+(ac.length?"e7dher mel accents / lettres spéciales : "+ac.join(" "):"ekteb el mot bchwaya 3 wala 4 marrat bech yethabbet")));
    c.append(d);});
  R.append(el("div","lbl","explications"),c);btn.remove();
}
const dkey=t=>{const d=new Date(t);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function stats(){
  const H=S.hist,now=Date.now(),W=7*864e5;
  const w1=H.filter(h=>now-h.d<W),w0=H.filter(h=>now-h.d>=W&&now-h.d<2*W),last=H.slice(-10);
  const lw=avg(last.map(h=>h.w)),la=avg(last.map(h=>h.a));
  const tw=last.reduce((s,h)=>s+(h.n||0),0),te=last.reduce((s,h)=>s+(h.e||0),0),accRate=tw?te/tw*100:0;
  const tot=Object.keys(D).length,mast=Object.keys(S.ok).filter(k=>S.ok[k]>=3&&D[k]).length;
  const sc=Math.round(Math.max(0,Math.min(100,.4*Math.max(0,Math.min(100,(la-80)*5))+.3*Math.min(100,lw/60*100)+.2*Math.max(0,100-accRate*5)+.1*Math.min(100,mast/tot*200))));
  const days=new Set(H.map(h=>dkey(h.d)));let streak=0,t=now;if(!days.has(dkey(t)))t-=864e5;while(days.has(dkey(t))){streak++;t-=864e5;}
  return{n:H.length,n0:w0.length,wpm:avg(w1.map(h=>h.w)),acc:avg(w1.map(h=>h.a)),wpm0:avg(w0.map(h=>h.w)),acc0:avg(w0.map(h=>h.a)),accRate,tot,mast,sc,streak,today:H.filter(h=>dkey(h.d)===dkey(now)).length,lvl:sc<20?"A1":sc<40?"A2":sc<60?"B1":sc<80?"B2":"C1"};
}
function lines(H){
  const NS="http://www.w3.org/2000/svg",s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 600 150");s.setAttribute("class","gr");s.setAttribute("preserveAspectRatio","none");
  if(H.length<2)return s;
  const mw=Math.max(10,...H.map(h=>h.w))*1.1;
  [["w","var(--main)",h=>h.w/mw],["a","var(--sub)",h=>Math.max(0,(h.a-60)/40)]].forEach(([k,c,f])=>{const p=document.createElementNS(NS,"polyline");
    p.setAttribute("points",H.map((h,i)=>(10+i/(H.length-1)*580)+","+(140-f(h)*125)).join(" "));p.setAttribute("fill","none");p.setAttribute("stroke",c);p.setAttribute("stroke-width","2.5");s.append(p);});
  return s;
}
function dash(){
  const R=$("dash");R.textContent="";const st=stats();
  const hero=el("div","hero"),a=el("div"),b=el("div");
  a.append(el("div","lbl","niveau estimé (frappe + orthographe)"),el("div","v",st.n?st.lvl:"—"));
  b.append(el("div",null,st.n?"score "+st.sc+" / 100":"fais quelques tests pour calculer ton niveau"),el("div","lbl","40% précision · 30% vitesse · 20% accents · 10% vocabulaire maîtrisé (indicatif, ce n’est pas un diplôme)"));
  hero.append(a,b);R.append(hero);
  const kp=el("div","kp");
  const k=(v,l,tr)=>{const d=el("div"),x=el("b",null,v);if(typeof tr==="number"&&Math.abs(tr)>=.5){const i=el("i",tr>0?"up":"dn",(tr>0?"▲ +":"▼ ")+Math.round(tr));x.append(i);}d.append(x,el("span",null,l));kp.append(d);};
  k(Math.round(st.wpm)+" mpm","vitesse moyenne 7 jours",st.n0?st.wpm-st.wpm0:null);
  k(Math.round(st.acc)+"%","précision moyenne 7 jours",st.n0?st.acc-st.acc0:null);
  k(st.accRate.toFixed(1)+"%","mots avec faute d’accent (10 derniers tests)");
  k(st.mast+" / "+st.tot,"vocabulaire maîtrisé (3 réussites)");
  k(st.today+" / "+S.goal.tests,"tests aujourd’hui");
  k(st.streak+" j","série de jours");
  k(Object.keys(S.missed).length,"mots à retravailler");
  k(Math.round(Object.values(S.pb).reduce((x,y)=>Math.max(x,y),0))+" mpm","record");
  R.append(kp);
  const og=el("div","hero");og.style.display="block";og.append(el("div","lbl","mes objectifs (modifiables)"));
  const gl=el("div","gl");
  [["tests","tests par jour",st.today/S.goal.tests],["acc","précision cible % (moyenne 7 jours)",st.acc/S.goal.acc],["wpm","vitesse cible mpm (moyenne 7 jours)",st.wpm/S.goal.wpm]].forEach(([key,l,p])=>{
    const left=el("div");left.append(el("div",null,l+" — "+Math.min(100,Math.round(p*100))+"%"));const pb=el("div","pb"),i=el("i");i.style.width=Math.min(100,p*100)+"%";pb.append(i);left.append(pb);
    const inp=document.createElement("input");inp.type="number";inp.value=S.goal[key];inp.onchange=()=>{S.goal[key]=Math.max(1,+inp.value||1);save();dash();};gl.append(left,inp);});
  og.append(gl);R.append(og);
  R.append(el("div","lbl","évolution des 30 derniers tests (jaune : vitesse · gris : précision)"),lines(S.hist.slice(-30)));
  R.append(el("div","lbl","progression du vocabulaire par thème (mots maîtrisés)"));
  Object.keys(TH).forEach(n=>{const tt=TH[n],m=tt.filter(w=>(S.ok[w]||0)>=3).length;
    const d=el("div");d.append(el("div",null,n+" — "+m+" / "+tt.length));const pb=el("div","pb"),i=el("i");i.style.width=(m/tt.length*100)+"%";pb.append(i);d.append(pb);R.append(d);});
}
$("tabT").onclick=()=>reset();
$("tabD").onclick=()=>{clearInterval(timer);started=false;$("test").style.display="none";$("res").style.display="none";$("dash").style.display="block";$("tabD").className="o on";$("tabT").className="o";dash();};
bars();reset();
