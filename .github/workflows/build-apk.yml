name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: mon-app   # ← Mets ici le nom de TON dossier

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache-dependency-path: mon-app/package-lock.json   # ← Même nom ici

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets & sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build Debug & Release APK
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: frenchtype-android-apk
          path: |
            mon-app/android/app/build/outputs/apk/debug/app-debug.apk
            mon-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
